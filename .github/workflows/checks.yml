name: Site checks
on:
  pull_request:
  push:
    branches: [main]
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: House rules, links, images, dead files, secrets
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python scripts/check_site.py --base origin/${{ github.base_ref }}
          else
            python scripts/check_site.py
          fi
      - name: Form handler syntax
        run: node --check api/register.js
